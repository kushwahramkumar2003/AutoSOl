[package]
name = "blockchain_monitor2"
version = "0.1.0"
edition = "2021"

[dependencies]
solana-client = "~1.18.0"
solana-sdk = "~1.18.0"
solana-transaction-status = "~1.18.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
borsh = "0.10"
redis = { version = "0.24", features = ["tls-rustls"] }
tokio = { version = "1.0", features = ["full"] }
base64 = "0.22"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
dotenv = "0.15"
bs58 = "0.5.1"