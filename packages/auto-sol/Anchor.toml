[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
auto_sol = "DfnY1thcxGzhPZaUy4V9S4QwyBP1VoshuY87iQxtyrm8"

[registry]
# url = "http://127.0.0.1:8899"
url = "https://api.apr.dev"

[provider]
# cluster = "Localnet"
cluster = "https://api.devnet.solana.com"
wallet = "~/.config/solana/id.json"

[scripts]
# your test script stays
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

# the initialize script
initialize = """
// `feeVault` is a Keypair you must import or create above in this script context
const feeVault = web3.Keypair.generate();
await program.rpc.initialize({
  accounts: {
    feeVault: feeVault.publicKey,
    authority: provider.wallet.publicKey,
    systemProgram: web3.SystemProgram.programId,
  },
  signers: [feeVault],
  instructions: [
    await program.account.feeVault.createInstruction(feeVault),
  ],
});
console.log('Fee vault created:', feeVault.publicKey.toBase58());
"""
